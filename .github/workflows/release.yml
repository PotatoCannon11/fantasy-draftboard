name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: draftboard-linux-x86_64
            ext: ""
          # Apple Silicon only: GitHub is retiring the macos-13 Intel
          # runners and they sit queued indefinitely, which blocks the whole
          # release. Intel Mac users can install the wheel with pipx.
          - os: macos-14
            asset: draftboard-macos-arm64
            ext: ""
          - os: windows-latest
            asset: draftboard-windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m pip install -r requirements.txt

      # Built from packaging/ on purpose: PyInstaller puts the build CWD on its
      # analysis path, and anything importable from the repo root can shadow a
      # module of the same name inside the package.
      - name: Build binary
        working-directory: packaging
        run: pyinstaller draftboard.spec --noconfirm --distpath ../dist/bin

      - name: Smoke test
        shell: bash
        run: |
          BIN="dist/bin/draftboard${{ matrix.ext }}"
          "$BIN" --help
          # A fresh data home must explain itself rather than trace back.
          out=$(FANTASY_HOME="${{ runner.temp }}/fresh" "$BIN" || true)
          echo "$out"
          echo "$out" | grep -q "No draft board yet" || {
            echo "first-run message missing"; exit 1; }

      - name: Rename
        shell: bash
        run: mv "dist/bin/draftboard${{ matrix.ext }}" "dist/bin/${{ matrix.asset }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/bin/${{ matrix.asset }}${{ matrix.ext }}

  release:
    needs: [wheel, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
