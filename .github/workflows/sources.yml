name: sources

# Are the upstream feeds still up, and still shaped the way we expect?
#
# This is the canary the test suite deliberately is not. Every source here is a
# free, unauthenticated third-party endpoint; they change, rate-limit and block
# without notice. Finding that out on draft morning is the failure mode worth
# engineering against, so check weekly and shout early.
on:
  schedule:
    - cron: "0 13 * * 1"      # Mondays, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Pull every source and build a board
        id: pull
        run: |
          set -o pipefail
          python -m fantasydraft.run_pipeline 2>&1 | tee pull.log

      - name: Check the board is sane
        run: python -m fantasydraft.validate

      - name: Report any degraded source
        run: |
          # The ingest degrades over a dead feed rather than aborting, which is
          # right for draft day but means a silent [warn] is exactly what this
          # job exists to surface.
          if grep -q "\[warn\]" pull.log; then
            echo "::warning::one or more sources degraded"
            grep "\[warn\]" pull.log
            exit 1
          fi
          echo "all sources answered"

      - name: Open an issue if a source is down
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Upstream data source degraded";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "data-source",
            });
            const body = `The weekly source check failed on ${new Date()
              .toISOString().slice(0, 10)}.\n\n` +
              `[Run log](${context.serverUrl}/${context.repo.owner}/` +
              `${context.repo.repo}/actions/runs/${context.runId})\n\n` +
              `A degraded feed does not break the board - the ingest falls ` +
              `back to the cached copy - but it does mean those numbers stop ` +
              `updating. Worth fixing before draft week.`;
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["data-source"],
              });
            }
